services:
  - type: web
    name: billflow-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PYTHONPATH
        value: .
databases:
  - name: billflow-db
    databaseName: billflow
    user: billflow
